<script>
(()=>{'use strict';const mem={cool:0,move:0,gather:0},sources={cool:new Set,move:new Set,gather:new Set},announced=new Set,buttons=[...document.querySelectorAll('.mode')],toast=document.querySelector('#toast'),status=document.querySelector('#status'),layers={cool:document.querySelector('#cool-layer'),move:document.querySelector('#move-layer'),gather:document.querySelector('#gather-layer'),cm:document.querySelector('#cool-move-layer'),mg:document.querySelector('#move-gather-layer'),gc:document.querySelector('#gather-cool-layer'),living:document.querySelector('#living-layer')};let last=performance.now(),hidden=false;const cap=n=>Math.max(0,Math.min(1,n)),ease=n=>cap((n-.55)/.45),pair=(a,b)=>Math.min(mem[a],mem[b]),show=(text)=>{toast.textContent=text;toast.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('show'),1800)};function reveal(el,p,threshold){p=p<threshold?0:cap((p-threshold)/(1-threshold));el.style.setProperty('--p',p);el.classList.toggle('on',p>0)}function updateView(){for(const k in mem){document.documentElement.style.setProperty('--'+k,mem[k]);document.querySelector('#rail-'+k).style.width=(mem[k]*100)+'%';layers[k].style.setProperty('--p',mem[k]);document.querySelector('#plan-'+k).style.opacity=sources[k].size?'.9':'0'}reveal(layers.cm,pair('cool','move'),.55);reveal(layers.mg,pair('move','gather'),.55);reveal(layers.gc,pair('gather','cool'),.55);reveal(layers.living,Math.min(mem.cool,mem.move,mem.gather),.62);const items=[['cool','CANOPY SPINE'],['move','BIKE CONNECTOR'],['gather','POCKET PLAZA']];items.forEach(([k,name])=>{if(mem[k]>=.35&&!announced.has(k)){announced.add(k);status.textContent=name;show(name)}});[['cm','SHADED MOBILITY CORRIDOR'],['mg','MARKET LOOP'],['gc','CIVIC WATER COMMONS'],['living','LIVING BLOCK']].forEach(([key,name])=>{if(layers[key].classList.contains('on')&&!announced.has(key)){announced.add(key);status.textContent=name;show(name)}})}function start(mode,id){if(!sources[mode].size)mem[mode]=cap(mem[mode]+.12);sources[mode].add(id);document.querySelector('[data-mode="'+mode+'"]').setAttribute('aria-pressed','true');updateView()}function stop(mode,id){sources[mode].delete(id);if(!sources[mode].size)document.querySelector('[data-mode="'+mode+'"]').setAttribute('aria-pressed','false');updateView()}function bindHold(button){const mode=button.dataset.mode;button.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();const id='p'+e.pointerId;button.setPointerCapture(e.pointerId);start(mode,id)});['pointerup','pointercancel','lostpointercapture'].forEach(type=>button.addEventListener(type,e=>stop(mode,'p'+e.pointerId)))}buttons.forEach(bindHold);addEventListener('keydown',e=>{if(e.repeat||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;const mode=({c:'cool',m:'move',g:'gather'})[e.key.toLowerCase()];if(mode){e.preventDefault();start(mode,'k'+mode)}});addEventListener('keyup',e=>{const mode=({c:'cool',m:'move',g:'gather'})[e.key.toLowerCase()];if(mode)stop(mode,'k'+mode)});function clearSources(){for(const k in sources){sources[k].clear();document.querySelector('[data-mode="'+k+'"]').setAttribute('aria-pressed','false')}}addEventListener('blur',clearSources);document.addEventListener('visibilitychange',()=>{hidden=document.hidden;if(hidden)clearSources();last=performance.now()});document.querySelector('#reset').addEventListener('click',()=>{for(const k in mem)mem[k]=0;clearSources();announced.clear();status.textContent='NEUTRAL BLOCK';toast.textContent='';toast.classList.remove('show');Object.values(layers).forEach(l=>{l.classList.remove('on');l.style.setProperty('--p',0)});updateView()});function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(!hidden)for(const k in mem)if(sources[k].size)mem[k]=cap(mem[k]+.8*dt);updateView();requestAnimationFrame(frame)}updateView();requestAnimationFrame(frame)})();
</script></body></html>
