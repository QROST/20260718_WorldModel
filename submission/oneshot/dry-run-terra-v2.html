<style>
:root{--bg:#eee7d8;--cream:#e7d4b3;--stone:#c4ad8e;--asphalt:#454957;--rust:#a95335;--ink:#263746;--cool:#46a99b;--cyan:#55c6cb;--move:#e6a33a;--blue:#3563a7;--gather:#dd6862;--magenta:#b94e76;--gold:#d6a637}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden;background:var(--bg);font-family:ui-rounded,"Avenir Next",Avenir,system-ui,sans-serif;color:var(--ink)}body{background-image:radial-gradient(#26374611 .65px,transparent .65px);background-size:6px 6px}.screen{min-height:100svh;display:grid;grid-template-rows:1fr auto;position:relative}.masthead,.status{position:absolute;z-index:3;top:max(18px,env(safe-area-inset-top));padding:14px 17px;border:1px solid #26374633;background:#eee7d8d9;box-shadow:0 5px 18px #26374612}.masthead{left:clamp(15px,4vw,48px);max-width:320px}.status{right:clamp(15px,4vw,48px);font-size:11px;font-weight:800;letter-spacing:.12em;text-align:right}.eyebrow,h1,p{margin:0}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.17em;color:var(--rust)}h1{font-size:clamp(24px,3.2vw,43px);line-height:.95;letter-spacing:-.07em}.masthead p{margin-top:8px;font-size:12px;line-height:1.25}.stage{min-height:0;display:grid;place-items:center;padding:44px 12px 4px}.city{width:min(100%,1200px);height:min(76svh,760px);display:block}.city :is(#cool-layer,#move-layer,#gather-layer,#cool-move-layer,#move-gather-layer,#gather-cool-layer,#living-layer){opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none;transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1)}.city .show{opacity:1;transform:translate(0,0)!important}.city .rise{transform:translate(0,18px)}.city .draw{transform:translate(-8px,0)}.city .unfold{transform:scale(.88)}.city .route{stroke-dasharray:250;stroke-dashoffset:250;transition:stroke-dashoffset .8s ease}.city .show .route{stroke-dashoffset:0}.dock{z-index:4;justify-self:center;width:min(720px,calc(100% - 24px));margin:0 12px max(13px,env(safe-area-inset-bottom));padding:10px;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;border:1px solid #26374644;background:#eee7d8e8;box-shadow:0 10px 30px #26374622;backdrop-filter:blur(8px)}button{font:inherit;color:var(--ink);border:1.5px solid var(--ink);background:#fff9;min-height:52px;cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.055em;line-height:1.1;transition:transform .15s,background .15s,box-shadow .15s}button:hover,button:focus-visible{outline:0;transform:translateY(-2px);box-shadow:3px 3px 0 var(--ink)}button[aria-pressed=true]{background:var(--tone);color:#fff;box-shadow:inset 0 0 0 3px #fff8}button span{display:block;font-size:18px;margin-bottom:3px}.cool{--tone:var(--cool)}.move{--tone:var(--blue)}.gather{--tone:var(--gather)}.reset{padding:0 15px;background:#263746;color:#fff}.rails{grid-column:1/-1;display:flex;gap:4px;height:5px}.rail{flex:1;background:#26374622;overflow:hidden}.rail i{display:block;height:100%;width:var(--v,0%);background:var(--tone);transition:width .13s linear}.toast{position:absolute;z-index:5;bottom:105px;left:50%;transform:translateX(-50%) translateY(8px);opacity:0;padding:8px 13px;white-space:nowrap;background:var(--ink);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;transition:.25s}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.pulse{animation:pulse 1s ease-out 1}.bob{animation:bob 2.5s ease-in-out infinite}.glow{animation:glow 1.6s ease-in-out infinite}@keyframes pulse{from{opacity:.9;stroke-width:4;transform:scale(.7)}to{opacity:0;stroke-width:1;transform:scale(1.4)}}@keyframes bob{50%{transform:translateY(-2px)}}@keyframes glow{50%{opacity:.55}}@media(max-width:600px){.masthead{top:9px;left:12px;padding:9px;max-width:218px}.status{top:9px;right:12px;padding:9px;font-size:9px}.masthead p{font-size:10px}.stage{padding-top:18px;align-items:center}.dock{grid-template-columns:repeat(3,1fr);gap:5px;padding:7px}.reset{grid-column:1/-1}.toast{bottom:156px;font-size:9px}.city{height:min(68svh,620px)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="screen"><header class="masthead"><p class="eyebrow">INTERACTIVE CITY STUDY</p><h1>FORK THE BLOCK</h1><p><strong>DON’T PICK A FUTURE. STEER IT.</strong><br>Hold an intention. The block remembers.</p></header><output class="status" id="status">NEUTRAL BLOCK</output><section class="stage"><svg class="city" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="An interactive isometric city block with civic building, workshop, cinema and apartments">

<script>
(()=>{const memory={cool:0,move:0,gather:0},sources={cool:new Set,move:new Set,gather:new Set},announced=new Set,buttons=[...document.querySelectorAll('[data-mode]')],status=document.querySelector('#status'),toast=document.querySelector('#toast');let last=performance.now(),hidden=document.hidden;const thresholds=[['cool',.35,'CANOPY SPINE'],['move',.35,'BIKE CONNECTOR'],['gather',.35,'POCKET PLAZA'],['cool-move',.55,'SHADED MOBILITY CORRIDOR'],['move-gather',.55,'MARKET LOOP'],['gather-cool',.55,'CIVIC WATER COMMONS'],['living',.62,'LIVING BLOCK']];function announce(id,name){if(announced.has(id))return;announced.add(id);status.textContent=name;toast.textContent=name;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2200)}function progress(key){let a=key.split('-');return a[0]==='living'?Math.min(...Object.values(memory)):a.length===1?memory[a[0]]:Math.min(memory[a[0]],memory[a[1]])}function updateView(){for(const m in memory){document.querySelector('#'+m+'-rail').style.setProperty('--v',(memory[m]*100)+'%');document.querySelector('[data-mode="'+m+'"]').setAttribute('aria-pressed',sources[m].size>0)}for(const [id,t,name] of thresholds){let p=progress(id),g=document.querySelector('#'+(id==='living'?'living-layer':id+'-layer'));if(p>=t){g.classList.add('show');announce(id,name)}else g.classList.remove('show')}document.documentElement.style.backgroundColor=memory.cool&&memory.move&&memory.gather?'#eadfcb':'#eee7d8'}function bindHold(button){const mode=button.dataset.mode;const start=id=>{if(!sources[mode].size){memory[mode]=Math.min(1,memory[mode]+.06)}sources[mode].add(id);updateView()};const stop=id=>{sources[mode].delete(id);updateView()};button.addEventListener('pointerdown',e=>{button.setPointerCapture(e.pointerId);start('p'+e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(ev,e=>stop('p'+e.pointerId));button.addEventListener('keydown',e=>{if(e.repeat||e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea,[contenteditable=true]'))return;if(e.key===' '||e.key==='Enter'){e.preventDefault();start('b'+e.key)}});button.addEventListener('keyup',e=>stop('b'+e.key))}buttons.forEach(bindHold);addEventListener('keydown',e=>{if(e.repeat||e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea,[contenteditable=true]'))return;let mode={c:'cool',m:'move',g:'gather'}[e.key.toLowerCase()];if(mode){e.preventDefault();if(!sources[mode].size)memory[mode]=Math.min(1,memory[mode]+.06);sources[mode].add('k'+e.key.toLowerCase());updateView()}});addEventListener('keyup',e=>{let mode={c:'cool',m:'move',g:'gather'}[e.key.toLowerCase()];if(mode){sources[mode].delete('k'+e.key.toLowerCase());updateView()}});function clear(){Object.values(sources).forEach(s=>s.clear());updateView()}addEventListener('blur',clear);document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=performance.now();if(hidden)clear()});document.querySelector('#reset').addEventListener('click',()=>{for(const m in memory)memory[m]=0;Object.values(sources).forEach(s=>s.clear());announced.clear();toast.textContent='';toast.classList.remove('on');status.textContent='NEUTRAL BLOCK';document.querySelectorAll('.city .show').forEach(g=>g.classList.remove('show'));updateView()});function frame(now){let dt=Math.min(.1,(now-last)/1000);last=now;if(!hidden)for(const m in memory)if(sources[m].size)memory[m]=Math.min(1,memory[m]+.55*dt);updateView();requestAnimationFrame(frame)}updateView();requestAnimationFrame(frame)})();
</script></body></html>
