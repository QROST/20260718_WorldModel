<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORK THE BLOCK</title>
<style>
:root{--cool:0;--move:0;--gather:0;--cm:0;--mg:0;--gc:0;--life:0;--bg:#eee7d8;--ink:#263746;--rust:#a95335;--blue:#454957}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{transition:background .7s ease;background-image:radial-gradient(rgba(38,55,70,.055) .7px,transparent .8px);background-size:7px 7px}.app{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;position:relative}.masthead{position:absolute;z-index:3;top:clamp(18px,3vw,38px);left:clamp(18px,4vw,60px);max-width:310px}.masthead h1{margin:0;font-size:clamp(25px,4vw,48px);letter-spacing:-.07em;line-height:.82}.masthead p{margin:13px 0 0;font-size:11px;font-weight:800;letter-spacing:.12em;line-height:1.5}.masthead .instruction{color:#6e5c4c;font-weight:600;letter-spacing:.04em;text-transform:none}.status{position:absolute;z-index:3;right:clamp(18px,4vw,60px);top:clamp(20px,3.2vw,42px);padding:10px 14px;border:1px solid rgba(38,55,70,.3);background:rgba(238,231,216,.78);font-size:11px;font-weight:850;letter-spacing:.12em;backdrop-filter:blur(5px)}main{min-height:0;display:grid;place-items:center;padding:42px 16px 130px}svg{width:min(100%,1200px);height:auto;display:block;overflow:visible}.dock-wrap{position:fixed;z-index:5;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 24px))}.toast{min-height:22px;text-align:center;font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--ink);margin-bottom:7px;opacity:0;transform:translateY(5px);transition:.25s}.toast.show{opacity:1;transform:none}.dock{padding:10px;border:1px solid rgba(38,55,70,.28);background:rgba(238,231,216,.9);box-shadow:0 10px 25px rgba(38,55,70,.15);backdrop-filter:blur(8px);display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px}.hold{min-height:52px;border:1px solid var(--ink);background:#f5efdf;color:var(--ink);font:inherit;cursor:pointer;padding:7px 8px;display:flex;align-items:center;justify-content:center;gap:6px;flex-direction:column;font-size:10px;font-weight:900;letter-spacing:.08em;line-height:1}.hold b{font-size:17px;line-height:.6}.hold[data-mode="cool"]{--accent:#2b9f91}.hold[data-mode="move"]{--accent:#3568ad}.hold[data-mode="gather"]{--accent:#c54f6e}.hold:hover,.hold[aria-pressed="true"]{background:var(--accent);color:white;box-shadow:inset 0 0 0 3px rgba(255,255,255,.4)}.hold:focus-visible,#reset:focus-visible{outline:3px solid #eaa342;outline-offset:3px}#reset{border:1px solid var(--ink);background:#263746;color:white;font:inherit;font-size:10px;font-weight:900;letter-spacing:.08em;padding:0 12px;cursor:pointer}.rails{height:5px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px 1px 0}.rail{height:4px;background:#c4ad8e;overflow:hidden}.rail i{display:block;width:100%;height:100%;transform-origin:left;transform:scaleX(var(--v));background:var(--c);transition:transform .14s linear}.cool{--c:#2b9f91;--v:var(--cool)}.move{--c:#3568ad;--v:var(--move)}.gather{--c:#c54f6e;--v:var(--gather)}
svg .reveal{opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .55s ease,transform .65s cubic-bezier(.2,.8,.2,1)}#cool-layer{transform:translateY(12px);opacity:var(--cool)}#move-layer{transform:translateX(-10px);opacity:var(--move)}#gather-layer{transform:scale(.88);opacity:var(--gather)}#cool-move-layer{transform:translateY(-12px);opacity:var(--cm)}#move-gather-layer{transform:translateX(13px);opacity:var(--mg)}#gather-cool-layer{transform:scale(.88);opacity:var(--gc)}#living-layer{transform:scale(.82);opacity:var(--life)}.route{stroke-dasharray:400;stroke-dashoffset:calc(400 - 400 * var(--move))}.awning{transform:scaleY(var(--gather));transform-origin:top}.tree{transform:translateY(calc(15px - 15px * var(--cool)))}.warm{opacity:var(--life)}.pulse-ring{opacity:var(--life);animation:ring 1.8s ease-out both;animation-play-state:paused}.alive .pulse-ring{animation-play-state:running}@keyframes ring{0%{transform:scale(.4);opacity:0}30%{opacity:.9}100%{transform:scale(1.8);opacity:0}}@keyframes bob{50%{transform:translateY(-3px)}}.person{animation:bob 2.2s ease-in-out infinite}.lamp{filter:drop-shadow(0 0 5px #eaa342)}@media(max-width:600px){.masthead{max-width:190px}.masthead p{font-size:9px;margin-top:9px}.status{font-size:9px;padding:7px 9px}.dock{grid-template-columns:repeat(3,1fr)}#reset{grid-column:1/-1;min-height:32px}.dock-wrap{bottom:max(8px,env(safe-area-inset-bottom))}main{padding-bottom:155px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="app">

<div class="dock-wrap"><div id="toast" class="toast" aria-live="polite"></div><div class="dock" aria-label="Intention controls"><button class="hold" data-mode="cool" aria-label="Hold COOL: shade and water" aria-pressed="false"><b>✦</b>COOL</button><button class="hold" data-mode="move" aria-label="Hold MOVE: routes and transit" aria-pressed="false"><b>→</b>MOVE</button><button class="hold" data-mode="gather" aria-label="Hold GATHER: plaza and culture" aria-pressed="false"><b>●</b>GATHER</button><button id="reset" type="button">RESET</button></div><div class="rails" aria-label="Memory progress"><span class="rail cool"><i></i></span><span class="rail move"><i></i></span><span class="rail gather"><i></i></span></div></div>
</div>
<script>
(()=>{const root=document.documentElement,status=document.querySelector('#status'),toast=document.querySelector('#toast'),plan=document.querySelector('#plan'),life=document.querySelector('#living-layer');const memory={cool:0,move:0,gather:0},sources={cool:new Set,move:new Set,gather:new Set},announced=new Set;let last=performance.now(),hidden=document.hidden;
const labels={cool:'CANOPY SPINE',move:'BIKE CONNECTOR',gather:'POCKET PLAZA',cm:'SHADED MOBILITY CORRIDOR',mg:'MARKET LOOP',gc:'CIVIC WATER COMMONS',life:'LIVING BLOCK'};
function say(id){if(announced.has(id))return;announced.add(id);status.textContent=labels[id];toast.textContent=labels[id]+' REMEMBERED';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2100)}
function updateView(){let c=memory.cool,m=memory.move,g=memory.gather,cm=Math.min(c,m),mg=Math.min(m,g),gc=Math.min(g,c),li=Math.min(c,m,g);root.style.setProperty('--cool',c);root.style.setProperty('--move',m);root.style.setProperty('--gather',g);root.style.setProperty('--cm',cm);root.style.setProperty('--mg',mg);root.style.setProperty('--gc',gc);root.style.setProperty('--life',li);if(c>=.35)say('cool');if(m>=.35)say('move');if(g>=.35)say('gather');if(cm>=.55)say('cm');if(mg>=.55)say('mg');if(gc>=.55)say('gc');if(li>=.62){say('life');document.body.classList.add('alive')} }
function frame(now){if(!hidden){let dt=Math.min(.08,(now-last)/1000);for(const k in memory)if(sources[k].size)memory[k]=Math.min(1,memory[k]+.55*dt);updateView()}last=now;requestAnimationFrame(frame)}requestAnimationFrame(frame);
function bindHold(button,mode){const id='p'+mode;function start(e){if(e.type==='keydown'&&(e.repeat||e.target.matches('input,textarea,[contenteditable]')))return;e.preventDefault();sources[mode].add(e.pointerId??id);button.setAttribute('aria-pressed','true');memory[mode]=Math.min(1,memory[mode]+.06);plan.setAttribute('opacity','1');updateView();if(e.pointerId!=null)button.setPointerCapture(e.pointerId)}function stop(e){sources[mode].delete(e.pointerId??id);if(!sources[mode].size)button.setAttribute('aria-pressed','false');if(!Object.values(sources).some(s=>s.size))plan.setAttribute('opacity','0')}button.addEventListener('pointerdown',start);['pointerup','pointercancel','lostpointercapture'].forEach(x=>button.addEventListener(x,stop));button.addEventListener('keydown',e=>{if(e.key===mode[0].toUpperCase()||e.key===' '||e.key==='Enter')start(e)});button.addEventListener('keyup',e=>{if(e.key===mode[0].toUpperCase()||e.key===' '||e.key==='Enter')stop(e)})}document.querySelectorAll('.hold').forEach(b=>bindHold(b,b.dataset.mode));
window.addEventListener('keydown',e=>{if(e.repeat||e.target.matches('input,textarea,[contenteditable]'))return;let b={c:'cool',m:'move',g:'gather'}[e.key.toLowerCase()];if(b)document.querySelector('[data-mode="'+b+'"]').dispatchEvent(new KeyboardEvent('keydown',{key:e.key,bubbles:true}))});window.addEventListener('keyup',e=>{let b={c:'cool',m:'move',g:'gather'}[e.key.toLowerCase()];if(b)document.querySelector('[data-mode="'+b+'"]').dispatchEvent(new KeyboardEvent('keyup',{key:e.key,bubbles:true}))});
function clear(){for(const k in sources)sources[k].clear();document.querySelectorAll('.hold').forEach(b=>b.setAttribute('aria-pressed','false'));plan.setAttribute('opacity','0')}window.addEventListener('blur',clear);document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=performance.now();if(hidden)clear()});document.querySelector('#reset').addEventListener('click',()=>{clear();for(const k in memory)memory[k]=0;announced.clear();status.textContent='NEUTRAL BLOCK';toast.textContent='';toast.classList.remove('show');document.body.classList.remove('alive');updateView()});updateView()})();
</script></body></html>
